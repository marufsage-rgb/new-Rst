<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RST ELECTRONICS — Enterprise Suite</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
/* ============================================================
   GORGEOUS MODERN DESIGN SYSTEM
============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --grad-1:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  --grad-2:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);
  --grad-3:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);
  --grad-4:linear-gradient(135deg,#43e97b 0%,#38f9d7 100%);
  --grad-5:linear-gradient(135deg,#fa709a 0%,#fee140 100%);
  --grad-6:linear-gradient(135deg,#30cfd0 0%,#330867 100%);
  --grad-dark:linear-gradient(180deg,#0f0c29 0%,#1a1a3e 50%,#24243e 100%);
  --grad-primary:linear-gradient(135deg,#667eea,#764ba2,#f093fb);
  --grad-success:linear-gradient(135deg,#43e97b,#38f9d7);
  --grad-danger:linear-gradient(135deg,#f5576c,#fa709a);
  --grad-warning:linear-gradient(135deg,#f6d365,#fda085);
  --grad-info:linear-gradient(135deg,#4facfe,#00f2fe);

  --c-primary:#667eea; --c-accent:#f093fb; --c-success:#43e97b;
  --c-danger:#f5576c; --c-warning:#f6d365; --c-info:#4facfe;

  --glass-bg:rgba(255,255,255,.7); --glass-border:rgba(255,255,255,.3);
  --glass-dark-bg:rgba(255,255,255,.08); --glass-dark-border:rgba(255,255,255,.12);

  --bg:linear-gradient(135deg,#f5f7fa 0%,#e8ecf5 50%,#f0f2ff 100%);
  --bg-dark:radial-gradient(ellipse at top,#1a1a3e 0%,#0f0c29 50%,#05050f 100%);

  --text:#1a1a2e; --text-muted:#6b7280;
  --sh-sm:0 2px 8px rgba(102,126,234,.08);
  --sh-md:0 8px 24px rgba(102,126,234,.12);
  --sh-lg:0 20px 50px rgba(102,126,234,.2);
  --sh-xl:0 30px 80px rgba(102,126,234,.3);

  --r-sm:10px;--r-md:16px;--r-lg:24px;--r-xl:32px;--r-full:9999px;
  --trl:all .35s cubic-bezier(.4,0,.2,1);
  --trl-fast:all .2s cubic-bezier(.4,0,.2,1);
}

body{
  font-family:'Inter','Hind Siliguri','Cairo',sans-serif;
  background:var(--bg); color:var(--text); font-size:14px;
  overflow-x:hidden; min-height:100vh; -webkit-font-smoothing:antialiased;
  transition:background .5s; background-attachment:fixed;
}
body.dark-mode{background:var(--bg-dark);color:#fff}
body.rtl{direction:rtl;text-align:right;font-family:'Cairo','Hind Siliguri',sans-serif}
.bn-text{font-family:'Hind Siliguri',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}

/* Animated background */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 20% 30%,rgba(102,126,234,.15),transparent 50%),
    radial-gradient(circle at 80% 70%,rgba(240,147,251,.15),transparent 50%),
    radial-gradient(circle at 50% 50%,rgba(79,172,254,.1),transparent 50%);
  animation:bgShift 20s ease-in-out infinite;
}
@keyframes bgShift{0%,100%{opacity:.6}50%{opacity:1}}
a{text-decoration:none;color:inherit}

/* CARDS */
.glass{background:var(--glass-bg);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--sh-md);transition:var(--trl);}
body.dark-mode .glass{background:var(--glass-dark-bg);border-color:var(--glass-dark-border);}
.glass:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.card{border:none;border-radius:var(--r-lg);background:rgba(255,255,255,.75);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--sh-sm);transition:var(--trl);position:relative;overflow:hidden;}
body.dark-mode .card{background:var(--glass-dark-bg);border:1px solid var(--glass-dark-border);color:#fff}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-primary);opacity:0;transition:opacity .3s;}
.card:hover::before{opacity:1}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}

/* BUTTONS */
.btn{border-radius:var(--r-md);font-weight:600;padding:10px 20px;transition:var(--trl);border:none;position:relative;overflow:hidden;letter-spacing:.3px;font-size:13.5px;}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.3),transparent);opacity:0;transition:opacity .3s;}
.btn:hover::before{opacity:1}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.btn-p{background:var(--grad-primary);color:#fff;background-size:200% 200%;animation:gradShift 6s ease infinite}
.btn-p:hover{color:#fff;background-position:right center;box-shadow:var(--sh-lg)}
.btn-s{background:var(--grad-success);color:#fff}
.btn-danger{background:var(--grad-danger);color:#fff}
.btn-warning{background:var(--grad-warning);color:#333}
.btn-info{background:var(--grad-info);color:#fff}
.btn-glass{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;}
.btn-glass:hover{background:rgba(255,255,255,.25);color:#fff}
.btn-outline-primary{border:2px solid var(--c-primary);color:var(--c-primary);background:transparent}
.btn-outline-primary:hover{background:var(--grad-primary);color:#fff;border-color:transparent}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* TOP BAR & HEADER */
.topbar{background:linear-gradient(90deg,#1a1a3e 0%,#2d1b4e 50%,#1a1a3e 100%);color:#fff;font-size:12px;padding:8px 0;position:relative;overflow:hidden;}
.topbar::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--grad-primary);opacity:.6;}
.topbar a{color:rgba(255,255,255,.8);margin:0 10px;transition:var(--trl-fast)}
.topbar a:hover{color:var(--c-accent)}
.public-header{background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(180%);padding:16px 0;box-shadow:0 4px 30px rgba(0,0,0,.05);position:sticky;top:0;z-index:1000;border-bottom:1px solid rgba(255,255,255,.4);}
body.dark-mode .public-header{background:rgba(15,12,41,.85);border-color:rgba(255,255,255,.08)}
.public-logo{font-size:26px;font-weight:900;background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:flex;align-items:center;gap:10px;letter-spacing:-.5px;}
.public-logo i{-webkit-text-fill-color:var(--c-primary);animation:spinLogo 20s linear infinite;}
@keyframes spinLogo{to{transform:rotate(360deg)}}
.public-search{flex:1;max-width:650px;margin:0 auto}
.public-search .input-group{border-radius:var(--r-full);overflow:hidden;box-shadow:var(--sh-sm);background:#fff;border:2px solid transparent;transition:var(--trl);}
.public-search .input-group:focus-within{border-color:var(--c-primary);box-shadow:0 0 0 4px rgba(102,126,234,.1)}
body.dark-mode .public-search .input-group{background:rgba(255,255,255,.08)}
.public-search input{border:none;padding:14px 24px;font-size:14px;background:transparent;color:inherit;}
.public-search input:focus{box-shadow:none;background:transparent}
.public-search button{background:var(--grad-primary);color:#fff;border:none;padding:0 28px;transition:var(--trl);font-weight:600;}
.header-icons a{color:var(--text);font-size:20px;margin-left:20px;position:relative;transition:var(--trl);width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-full);}
body.dark-mode .header-icons a{color:#fff}
.header-icons a:hover{background:var(--grad-primary);color:#fff;transform:translateY(-2px);box-shadow:var(--sh-md)}
.header-icons .badge{position:absolute;top:-4px;right:-4px;font-size:10px;padding:3px 6px;background:var(--grad-danger);border-radius:var(--r-full);color:#fff;font-weight:700;min-width:20px;text-align:center;}
.public-nav{background:linear-gradient(90deg,#667eea,#764ba2,#667eea);background-size:200% 100%;padding:0;animation:gradShift 10s ease infinite;box-shadow:0 4px 20px rgba(102,126,234,.3);}
.public-nav .nav-link{color:#fff!important;padding:16px 22px;font-weight:600;font-size:14px;position:relative;transition:var(--trl-fast);}
.public-nav .nav-link::after{content:'';position:absolute;bottom:0;left:50%;width:0;height:3px;background:#fff;transition:var(--trl);transform:translateX(-50%);border-radius:var(--r-full);}
.public-nav .nav-link:hover::after{width:60%}

/* HERO SECTION */
.hero{padding:80px 0;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 40%,rgba(102,126,234,.15),transparent 40%),radial-gradient(circle at 80% 60%,rgba(240,147,251,.15),transparent 40%);}
.hero-content h4{font-size:14px;letter-spacing:4px;font-weight:800;text-transform:uppercase;background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:20px;display:inline-block;}
.hero-content h1{font-size:56px;font-weight:900;margin-bottom:24px;line-height:1.1;letter-spacing:-2px;color:var(--text);}
.hero-content h1 span{background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
body.dark-mode .hero-content h1{color:#fff}
.hero-content p{font-size:17px;color:var(--text-muted);margin-bottom:32px;line-height:1.7}
.hero-content .btn{background:var(--grad-primary);color:#fff;padding:18px 44px;border-radius:var(--r-full);font-weight:700;font-size:15px;box-shadow:var(--sh-lg);background-size:200% 200%;animation:gradShift 6s ease infinite;}
.hero-img{text-align:center;position:relative;animation:float 4s ease-in-out infinite;}
.hero-img i{font-size:220px;background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:.2;filter:drop-shadow(0 20px 40px rgba(102,126,234,.3));}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-20px) rotate(3deg)}}
@media(max-width:768px){.hero-content h1{font-size:34px;letter-spacing:-1px}.hero-img i{font-size:140px}.hero{padding:40px 0}}

/* PRODUCT CARD */
.product-card{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-radius:var(--r-lg);overflow:hidden;transition:var(--trl);cursor:pointer;height:100%;border:1px solid rgba(255,255,255,.6);box-shadow:var(--sh-sm);position:relative;}
body.dark-mode .product-card{background:var(--glass-dark-bg);border-color:var(--glass-dark-border)}
.product-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:var(--sh-xl);border-color:var(--c-accent);}
.product-thumb{position:relative;padding:24px;text-align:center;min-height:200px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(102,126,234,.05),rgba(240,147,251,.05));}
.product-emoji{font-size:72px;transition:var(--trl);filter:drop-shadow(0 8px 16px rgba(0,0,0,.1));}
.product-card:hover .product-emoji{transform:scale(1.15) rotate(-5deg)}
.product-actions{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateX(10px);transition:var(--trl);}
.product-card:hover .product-actions{opacity:1;transform:translateX(0)}
.product-actions button{width:40px;height:40px;border-radius:var(--r-full);border:none;background:rgba(255,255,255,.95);color:var(--c-primary);box-shadow:var(--sh-md);cursor:pointer;font-size:14px;transition:var(--trl);backdrop-filter:blur(10px);}
.product-actions button:hover{background:var(--grad-primary);color:#fff;transform:scale(1.1) rotate(8deg);box-shadow:var(--sh-lg);}
.product-info{padding:18px;text-align:center}
.product-info h6{font-size:11px;color:var(--text-muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;}
.product-info h5{font-size:15px;margin:0 0 12px;font-weight:700;height:40px;overflow:hidden;line-height:1.4;}
.product-price{font-size:20px;font-weight:900;background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px;}

/* ADMIN APP */
#adminApp{display:none}
.sidebar{position:fixed;top:0;left:0;width:280px;height:100vh;background:var(--grad-dark);color:#fff;overflow-y:auto;z-index:1030;transition:var(--trl);border-right:1px solid rgba(255,255,255,.08);box-shadow:4px 0 40px rgba(0,0,0,.2);}
body.rtl .sidebar{left:auto;right:0;border-right:none;border-left:1px solid rgba(255,255,255,.08)}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--grad-primary);border-radius:3px;}
.sidebar .brand{padding:24px 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);position:relative;}
.sidebar .brand::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:60px;height:2px;background:var(--grad-primary);border-radius:var(--r-full);}
.sidebar .brand h3{color:#fff;font-size:22px;margin:0;font-weight:900;letter-spacing:-.5px;}
.sidebar .brand h3 span{background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sidebar .brand small{color:rgba(255,255,255,.5);font-size:10px;letter-spacing:2px;display:block;margin-top:4px;text-transform:uppercase;font-weight:600;}
.mg{padding:12px 20px 4px;font-size:10px;text-transform:uppercase;color:rgba(255,255,255,.35);letter-spacing:2px;font-weight:800;}
.sidebar .nav-link{color:rgba(255,255,255,.75);padding:10px 18px;font-size:13.5px;display:flex;align-items:center;gap:12px;border-radius:var(--r-md);margin:3px 12px;cursor:pointer;transition:var(--trl);font-weight:500;position:relative;}
.sidebar .nav-link::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:0;background:var(--grad-primary);border-radius:var(--r-full);transition:height .3s;}
.sidebar .nav-link:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(4px);}
.sidebar .nav-link:hover::before{height:60%}
.sidebar .nav-link.active{background:var(--grad-primary);color:#fff;box-shadow:0 8px 20px rgba(102,126,234,.4);transform:translateX(4px);}
.sidebar .nav-link.active::before{display:none}
.sidebar .nav-link i{width:20px;text-align:center;font-size:14px}
.am{margin-left:280px;padding:24px;min-height:100vh;transition:var(--trl);animation:fadeInUp .5s ease;}
body.rtl .am{margin-left:0;margin-right:280px}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.mt{display:none;position:fixed;bottom:24px;left:24px;z-index:1040;width:56px;height:56px;border-radius:var(--r-full);background:var(--grad-primary);color:#fff;border:none;font-size:20px;box-shadow:var(--sh-lg);cursor:pointer;transition:var(--trl);background-size:200% 200%;animation:gradShift 6s ease infinite;}
.mt:hover{transform:scale(1.1) rotate(90deg)}
.ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1025;animation:fadeIn .3s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:991px){.sidebar{transform:translateX(-100%)}body.rtl .sidebar{transform:translateX(100%)}.sidebar.open{transform:translateX(0)}.am{margin-left:0;padding:16px}body.rtl .am{margin-right:0}.mt{display:flex;align-items:center;justify-content:center}.ovl.show{display:block}}

/* MODALS & FORMS */
.modal-content{border:none;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-xl);background:rgba(255,255,255,.98);backdrop-filter:blur(30px);}
body.dark-mode .modal-content{background:rgba(26,26,62,.98);color:#fff}
.modal-header{background:var(--grad-primary);color:#fff;padding:20px 24px;border:none;position:relative;}
.modal-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:rgba(255,255,255,.2);}
.form-control,.form-select{border:2px solid transparent;border-radius:var(--r-md);padding:10px 16px;font-size:14px;background:rgba(255,255,255,.8);transition:var(--trl);box-shadow:var(--sh-sm);}
body.dark-mode .form-control,body.dark-mode .form-select{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.1);}
.form-control:focus,.form-select:focus{border-color:var(--c-primary);box-shadow:0 0 0 4px rgba(102,126,234,.15);background:#fff;}
body.dark-mode .form-control:focus,body.dark-mode .form-select:focus{background:rgba(255,255,255,.1)}
.form-label{font-weight:600;font-size:13px;color:var(--text);margin-bottom:6px}
body.dark-mode .form-label{color:rgba(255,255,255,.9)}

/* CHAT */
.chat-toggle{position:fixed;bottom:24px;right:24px;z-index:1050;width:64px;height:64px;border-radius:var(--r-full);border:none;background:var(--grad-primary);color:#fff;font-size:24px;box-shadow:0 10px 40px rgba(102,126,234,.5);cursor:pointer;transition:var(--trl);background-size:200% 200%;animation:gradShift 5s ease infinite,pulse 2s infinite;}
body.rtl .chat-toggle{right:auto;left:24px}
.chat-toggle:hover{transform:scale(1.1) rotate(15deg)}
@keyframes pulse{0%,100%{box-shadow:0 10px 40px rgba(102,126,234,.5)}50%{box-shadow:0 10px 40px rgba(102,126,234,.5),0 0 0 20px rgba(240,147,251,.15)}}
.chat-window{position:fixed;bottom:100px;right:24px;width:400px;height:600px;background:rgba(255,255,255,.98);backdrop-filter:blur(30px);border-radius:var(--r-xl);box-shadow:var(--sh-xl);display:none;flex-direction:column;overflow:hidden;z-index:1050;border:1px solid rgba(255,255,255,.4);animation:slideUpChat .4s cubic-bezier(.68,-.55,.265,1.55);}
body.dark-mode .chat-window{background:rgba(26,26,62,.98);color:#fff;border-color:rgba(255,255,255,.1)}
@keyframes slideUpChat{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
body.rtl .chat-window{right:auto;left:24px}
.chat-window.open{display:flex}
.chat-header{background:var(--grad-primary);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.1);}
.chat-messages{flex:1;overflow-y:auto;padding:20px;background:linear-gradient(180deg,rgba(102,126,234,.03),rgba(240,147,251,.03));}
body.dark-mode .chat-messages{background:rgba(0,0,0,.15)}
.chat-msg{margin-bottom:12px;padding:12px 16px;border-radius:var(--r-lg);max-width:85%;font-size:13.5px;line-height:1.6;animation:msgIn .3s ease;word-break:break-word;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{background:var(--grad-primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px;box-shadow:0 4px 15px rgba(102,126,234,.3);}
.chat-msg.ai{background:rgba(255,255,255,.9);border:1px solid rgba(102,126,234,.1);border-bottom-left-radius:4px;box-shadow:var(--sh-sm);}
body.dark-mode .chat-msg.ai{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08);color:#fff}
.chat-input-area{padding:14px;background:rgba(255,255,255,.7);border-top:1px solid rgba(102,126,234,.1);display:flex;gap:8px;backdrop-filter:blur(10px);}
body.dark-mode .chat-input-area{background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.05)}
.chat-input-area input{border-radius:var(--r-full);padding:12px 18px}
.chat-input-area button{border-radius:var(--r-full);width:46px;height:46px;flex-shrink:0;background:var(--grad-primary);color:#fff;border:none;transition:var(--trl);}
.chat-input-area button:hover{transform:scale(1.1) rotate(8deg);box-shadow:var(--sh-md)}

/* UTILITIES & MISC */
#toastContainer{position:fixed;top:24px;right:24px;z-index:3000;display:flex;flex-direction:column;gap:12px;max-width:380px;}
body.rtl #toastContainer{right:auto;left:24px}
.app-toast{min-width:300px;padding:16px 20px;border-radius:var(--r-md);color:#fff;font-weight:600;box-shadow:var(--sh-xl);display:flex;ali
